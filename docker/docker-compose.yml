version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: h1b_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-h1b_engine}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - h1b_pgdata:/var/lib/postgresql/data

volumes:
  h1b_pgdata:
