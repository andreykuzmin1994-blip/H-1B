[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h1b_engine"
version = "0.1.0"
description = "H-1B Transparency & Accountability Engine - data pipeline, scoring, and entity graph"
requires-python = ">=3.10"
authors = [{ name = "H-1B Transparency Project" }]
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "click>=8.1",
    "typer>=0.12",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-requests",
]

[project.scripts]
h1b-ingest = "h1b_engine.ingest.cli:app"
h1b-score = "h1b_engine.score.cli:app"
h1b-graph = "h1b_engine.graph.cli:app"
h1b-investigate = "h1b_engine.investigate.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["h1b_engine*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
